name: Unzip upload
on:
  push:
    paths: ['**.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit
        run: |
          git ls-files '*.zip' | while read -r z; do
            unzip -o "$z" -d .
            git rm -q "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded zip" || echo "Nothing to commit"
          git push
